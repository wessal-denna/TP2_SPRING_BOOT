<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accès refusé</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; display: flex; justify-content: center; padding-top: 100px; }
        .box { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); text-align: center; max-width: 450px; }
        h1 { color: #c62828; margin-top: 0; }
        .btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #1565c0; color: #fff; text-decoration: none; border-radius: 4px; }
        .btn:hover { background: #0d47a1; }
    </style>
</head>
<body>
<div class="box">
    <h1>Accès refusé</h1>
    <p>Vous n'avez pas les privilèges requis pour accéder à cette fonctionnalité.</p>
    <a class="btn" th:href="@{/home}">Retour à l'accueil</a>
</div>
</body>
</html>
