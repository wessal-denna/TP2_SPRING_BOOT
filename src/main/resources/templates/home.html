<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>Accueil</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 40px; }
        .box { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); max-width: 600px; margin: auto; }
        .btn { display: inline-block; padding: 10px 18px; margin: 6px 6px 6px 0; background: #1565c0; color: #fff; text-decoration: none; border-radius: 4px; }
        .btn:hover { background: #0d47a1; }
        .btn-admin { background: #6a1b9a; }
        .logout { background: #c62828; }
        .role { color: #555; font-size: 14px; }
    </style>
</head>
<body>
<div class="box">
    <h2 th:text="${message}">Bienvenue</h2>
    <p class="role">Connecté en tant que <b sec:authentication="name">utilisateur</b></p>

    <a class="btn" th:href="@{/medicaments/liste}">Liste des médicaments</a>
    <a class="btn btn-admin" sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Page Admin</a>
    <a class="btn logout" th:href="@{/logout}">Se déconnecter</a>
</div>
</body>
</html>
